[package]
name = "murmuration"
version = "0.1.0"
edition = "2021"
description = "One binary for the Murmuration plugin's hooks: `budget` and `handback`."
license = "AGPL-3.0-only"
publish = false

[features]
# a test build whose clock is the MURMURATION_NOW of the environment; never part of the shipped binary
testclock = []

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
