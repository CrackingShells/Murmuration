# Builds the `murmuration` hook binary on five runners, checks each against the Python hooks, and commits bin/ back to main when everything agrees. Cases:
# - main moves during the run: commit_back fetches origin/main, builds on that tip, commits only if the hashed sources (rust_sources_sha256, scripts_sha256) are unchanged, else exits 0 (the newer push runs its own build); it retries a rejected push 3 times.
# - commit-back loop: a GITHUB_TOKEN push starts no workflow, and the bump commit carries [skip ci].
# - token scope: contents: read everywhere; only commit_back and release have contents: write, and only on refs/heads/main; commit_back's concurrency group bin-commit serialises commits without cancelling one.
# - an artefact under the wrong target name: assemble checks that each murmuration-<t> holds exactly <binary-name>, sources.sha256 and a file the `file` command reports as <t>'s architecture.
# - an artefact missing or faulty (wrong name or type, other sources): assemble fails the job, Windows included; every target is required and no row has continue-on-error.
# - a wrong-architecture binary: each build row checks `file` before upload (and assemble again); a runner label that moved to another architecture fails there.
name: guard-binaries
# No path filter on a trigger: the commit check must run on every push to main, and a workflow skipped by `paths` leaves its checks pending. `changes` filters per job instead.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_back:
        description: "Commit the assembled bin/ to main (only honoured when run on main)"
        type: boolean
        default: false

permissions:
  contents: read

# A superseded PR run is cancelled; a run on main never is (a cancelled release can leave a tag without its Release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLUGIN: plugins/murmuration
  # the contract's ALL_TARGETS, in the order the matrix lists them
  ALL_TARGETS: "aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc"

jobs:
  # Does this event touch what the binaries are built from? A job skipped by `if` reports success, so the build matrix does not block a docs-only PR.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      gated: ${{ steps.diff.outputs.gated }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          gated=true
          why="no base to compare with (a manual run, a new branch or a rewritten history): everything is gated"
          if [ -n "${BASE//0/}" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null && files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null); then
            if grep -Eq '^(plugins/murmuration/(rust|scripts|hooks)/|\.github/workflows/guard-binaries\.yml$)' <<< "$files"; then
              why="plugins/murmuration/{rust,scripts,hooks}/** or this workflow changed"
            elif [ "$GITHUB_EVENT_NAME" != pull_request ] && ! python3 -I .github/scripts/manifest_matches.py; then
              # the build run of an earlier push was replaced or lost, so bin/ is behind its sources: build now, or every later release would fail closed
              why="bin/manifest.json does not match the sources at this commit"
            else
              gated=false
              why="nothing under plugins/murmuration/{rust,scripts,hooks}/** or this workflow changed"
            fi
          fi
          echo "gated=$gated ($why)"
          echo "gated=$gated" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.gated == 'true' }}
    # cargo test, an LTO release build and the hook self-test take well under 15 min even on the slow runners; 30 leaves room without letting a hung row hold commit_back for GitHub's 6 h default
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # one red row (Windows above all) must not cancel the others
      fail-fast: false
      matrix:
        include:
          # macos-14 is deprecated (unsupported from 2026-11-02, brownouts in October), so the arm64 Mac row is macos-15
          - { os: macos-15, target: aarch64-apple-darwin, py: python3, filepat: '^Mach-O 64-bit.*arm64' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, py: python3, filepat: '^Mach-O 64-bit.*x86_64' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, py: python3, filepat: '^ELF 64-bit.*x86-64' }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, py: python3, filepat: '^ELF 64-bit.*ARM aarch64' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, py: python, filepat: '^PE32\+ executable.*x86-64' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PY: ${{ matrix.py }}
      FILEPAT: ${{ matrix.filepat }}
    steps:
      # without this the Windows runner checks sources out with CRLF and its sources hash differs from the other rows'
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo --version && rustc --version
      # the scripts must read and write UTF-8 under a Windows code page; no other row can show it (the install_binary self-test is POSIX-only: its stand-in binary is a shell script)
      - name: The scripts do text I/O as UTF-8
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        run: '"$PY" -I "$PLUGIN/scripts/check_text_io.py"'
      - run: cargo test --manifest-path "$PLUGIN/rust/Cargo.toml" --target "$TARGET"
      - run: cargo build --release --manifest-path "$PLUGIN/rust/Cargo.toml" --target "$TARGET"
      - name: Copy the binary to bin/<target>/
        run: |
          name=$("$PY" -I "$PLUGIN/scripts/build_manifest.py" binary-name "$TARGET" | tr -d '\r')
          mkdir -p "$PLUGIN/bin/$TARGET"
          cp "$PLUGIN/rust/target/$TARGET/release/$name" "$PLUGIN/bin/$TARGET/$name"
          echo "BIN=$PLUGIN/bin/$TARGET/$name" >> "$GITHUB_ENV"
      - name: The binary has the architecture of the triple
        run: |
          desc=$(file -b "$BIN")
          echo "$desc"
          echo "$desc" | grep -Eq "$FILEPAT" || { echo "::error::$BIN is not a binary for $TARGET (expected /$FILEPAT/)"; exit 1; }
      - name: Record the sources the binary was built from
        run: |
          h=$("$PY" -I "$PLUGIN/scripts/build_manifest.py" sources-hash | tr -d '\r')
          printf '%s\n' "$h" > "$PLUGIN/bin/$TARGET/sources.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: murmuration-${{ matrix.target }}
          path: |
            ${{ env.BIN }}
            ${{ env.PLUGIN }}/bin/${{ matrix.target }}/sources.sha256
          if-no-files-found: error
          retention-days: 14

  assemble:
    # `!cancelled()` and not `success()`: a red row must not skip this job, which then reports the missing artefact itself. Every target is required, Windows included.
    # `changes` is named so that the job is skipped, not failed, when `build` was skipped
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.gated == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: murmuration-*
          path: artifacts
      # the target list is written in the matrix, in ALL_TARGETS and in the patterns below; this ties ALL_TARGETS (and the pattern table) to the contract's
      - name: ALL_TARGETS equals build_manifest.ALL_TARGETS
        run: |
          python3 -I -c '
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["PLUGIN"], "scripts"))
          from build_manifest import ALL_TARGETS
          mine = os.environ["ALL_TARGETS"].split()
          if sorted(mine) != sorted(ALL_TARGETS) or len(mine) != len(set(mine)):
              print("::error::workflow ALL_TARGETS %s differs from build_manifest.ALL_TARGETS %s" % (mine, ALL_TARGETS))
              sys.exit(1)
          '
      - name: Assemble bin/ from the artefacts and write the manifest
        run: |
          set -euo pipefail
          want_hash=$(python3 -I "$PLUGIN/scripts/build_manifest.py" sources-hash)
          # what `file` must say for each triple; a universal Mach-O starts with "Mach-O universal" and so fails these; keep in step with the matrix of `build`
          pattern() {
            case "$1" in
              aarch64-apple-darwin) echo '^Mach-O 64-bit.*arm64' ;;
              x86_64-apple-darwin) echo '^Mach-O 64-bit.*x86_64' ;;
              x86_64-unknown-linux-gnu) echo '^ELF 64-bit.*x86-64' ;;
              aarch64-unknown-linux-gnu) echo '^ELF 64-bit.*ARM aarch64' ;;
              x86_64-pc-windows-msvc) echo '^PE32\+ executable.*x86-64' ;;
              *) echo "::error::no file pattern for $1" >&2; echo 'NO PATTERN' ;;
            esac
          }
          failed=0
          # every target is required, Windows included: a missing or faulty artefact fails the job
          reject() {
            echo "::error::$1: $2"
            failed=1
          }
          rm -rf "${PLUGIN:?}"/bin/*/
          expected=()
          for t in $ALL_TARGETS; do
            dir="artifacts/murmuration-$t"
            if [ ! -d "$dir" ]; then reject "$t" "no artefact murmuration-$t (its row did not finish)"; continue; fi
            name=$(python3 -I "$PLUGIN/scripts/build_manifest.py" binary-name "$t")
            if [ ! -f "$dir/$name" ] || [ ! -f "$dir/sources.sha256" ] || [ "$(find "$dir" -type f | wc -l)" -ne 2 ]; then
              reject "$t" "the artefact is not exactly $name and sources.sha256: $(cd "$dir" && echo *)"; continue
            fi
            desc=$(file -b "$dir/$name")
            if ! echo "$desc" | grep -Eq "$(pattern "$t")"; then
              reject "$t" "$name is not a binary for this triple (file says: $desc)"; continue
            fi
            have_hash=$(tr -d '\r\n' < "$dir/sources.sha256")
            if [ "$have_hash" != "$want_hash" ]; then
              reject "$t" "built from other sources ($have_hash, this checkout has $want_hash)"; continue
            fi
            mkdir -p "$PLUGIN/bin/$t"
            cp "$dir/$name" "$PLUGIN/bin/$t/$name"
            if [ "$t" != x86_64-pc-windows-msvc ]; then chmod +x "$PLUGIN/bin/$t/$name"; fi
            expected+=("$t")
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          list=$(IFS=,; echo "${expected[*]}")
          echo "targets: $list"
          python3 -I "$PLUGIN/scripts/build_manifest.py" --expect-targets "$list"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-and-manifest
          path: ${{ env.PLUGIN }}/bin
          if-no-files-found: error
          retention-days: 14

  install_smoke:
    needs: assemble
    # without a status function GitHub's implicit success() looks at every upstream job, so a red Windows build row would skip this job (seen in the 2026-10-27 dry run); gate on assemble's own result instead
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # the documented Windows requirement: a real `python3` on PATH (Microsoft Store Python has one, a python.org install has `python` and `py`). The runner's toolcache Python may already ship a python3.exe; when it does not, a copy of python.exe goes beside it, where its DLLs and standard library are found. The log shows which python3 the replay uses.
      - name: Put a python3.exe on PATH (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          python -I -c 'import os, shutil, sys; dst = os.path.join(os.path.dirname(sys.executable), "python3.exe"); print("python3.exe already there" if os.path.exists(dst) else "copying python.exe to python3.exe"); os.path.exists(dst) or shutil.copyfile(sys.executable, dst)'
          command -v python3
          python3 -I -c 'import sys; print(sys.executable, sys.version)'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-and-manifest
          path: assembled
      - name: The install and a budget hook run as Claude Code spawns them
        run: |
          set -euo pipefail
          # the checkout holds the previously committed bin/: replace it with what this run assembled (artefacts lose the executable bit)
          rm -rf "${PLUGIN:?}/bin"
          cp -R assembled "$PLUGIN/bin"
          find "$PLUGIN/bin" -mindepth 2 -type f ! -name '*.exe' -exec chmod +x {} +
          # paths with a space, as a user's profile folder can have
          root="$RUNNER_TEMP/plugin root"
          data="$RUNNER_TEMP/plugin data"
          lab="$RUNNER_TEMP/plugin lab"
          rm -rf "$root" "$data" "$lab"
          cp -R "$PLUGIN" "$root"
          mkdir -p "$data" "$lab"
          name=$(python3 -I "$PLUGIN/scripts/build_manifest.py" binary-name "$TARGET" | tr -d '\r')
          export ROOT="$root" DATA="$data" LAB="$lab" ARTEFACT="assembled/$TARGET/$name"
          # the replay reads hooks.json and spawns the rows in exec form: argv from `command` and `args`, ${CLAUDE_PLUGIN_ROOT} and ${CLAUDE_PLUGIN_DATA} replaced (native paths, backslashes on Windows), no shell
          python3 -I - <<'PY'
          import glob, json, os, shutil, subprocess, sys, time
          root, data, lab, artefact = (os.path.normpath(os.environ[k]) for k in ("ROOT", "DATA", "LAB", "ARTEFACT"))
          hooks = json.load(open(os.path.join(root, "hooks", "hooks.json"), encoding="utf-8"))["hooks"]
          errors = []
          sub = lambda s: s.replace("${CLAUDE_PLUGIN_ROOT}", root).replace("${CLAUDE_PLUGIN_DATA}", data)

          def row(event, pick):
              rows = [h for g in hooks[event] for h in g["hooks"] if pick(g, h)]
              assert len(rows) == 1, "%s: %d matching rows" % (event, len(rows))
              return rows[0]

          def spawn(label, h, event):
              assert "args" in h and "command" in h, "%s is not in exec form: %r" % (label, h)
              argv = [sub(h["command"])] + [sub(a) for a in h["args"]]
              env = dict(os.environ, CLAUDE_PLUGIN_ROOT=root, CLAUDE_PLUGIN_DATA=data)
              timeout = h["timeout"]   # the row's own limit: Claude Code kills the hook at that time
              print("== %s (timeout %ss)\n   argv: %r" % (label, timeout, argv), flush=True)
              start = time.monotonic()
              try:
                  p = subprocess.run(argv, input=json.dumps(dict(event, cwd=lab)).encode(), capture_output=True, timeout=timeout, env=env, cwd=lab)
              except (OSError, subprocess.SubprocessError) as exc:
                  print("   spawn failed after %.2fs: %s: %s" % (time.monotonic() - start, type(exc).__name__, exc), flush=True)
                  errors.append("%s did not start or ran out of time (%s: %s)" % (label, type(exc).__name__, exc))
                  return None
              print("   exit %d after %.2fs\n   stdout: %r\n   stderr: %r" % (p.returncode, time.monotonic() - start, p.stdout, p.stderr), flush=True)
              return p

          print("python3 on PATH:", shutil.which("python3"), flush=True)
          install = spawn("SessionStart install row", row("SessionStart", lambda g, h: any(a.endswith("install_binary.py") for a in h.get("args", []))), dict(hook_event_name="SessionStart", source="startup"))
          bindir = os.path.join(data, "bin")
          print("bin/ holds:", sorted(os.listdir(bindir)) if os.path.isdir(bindir) else None, flush=True)
          if install is not None:
              # the launcher path writes a JSON note to stdout, the binary path nothing
              if install.returncode != 0:
                  errors.append("install_binary.py exited %d" % install.returncode)
              if install.stdout:
                  errors.append("the launcher was installed, not the binary (stdout is not empty)")
          if not os.path.isfile(os.path.join(bindir, "murmuration.exe.verified")):
              errors.append("no bin/murmuration.exe.verified stamp")
          dest = os.path.join(bindir, "murmuration.exe")
          if not os.path.isfile(dest):
              errors.append("no bin/murmuration.exe")
          elif open(dest, "rb").read() != open(artefact, "rb").read():
              errors.append("bin/murmuration.exe is not the CI artefact %s" % artefact)
          # every row that execs the installed binary finds a file there
          for event, groups in hooks.items():
              for g in groups:
                  for h in g["hooks"]:
                      if h["command"].startswith("${CLAUDE_PLUGIN_DATA}") and not os.path.isfile(sub(h["command"])):
                          errors.append("%s row: %s is not a file" % (event, sub(h["command"])))
          os.makedirs(os.path.join(lab, "__statera__"), exist_ok=True)
          brief = "Your name is reproducer-w09-1.\nBudget: USD 1.00\nTime: min 100\nGo.\n"
          call = dict(hook_event_name="PreToolUse", tool_name="Agent", tool_use_id="tu1", tool_input=dict(subagent_type="murmuration:reproducer", prompt=brief, name="reproducer-w09-1"), transcript_path=os.path.join(lab, "s.jsonl"))
          budget = spawn("PreToolUse Agent budget row", row("PreToolUse", lambda g, h: g.get("matcher") == "Agent|Task" and h.get("args") == ["budget"]), call)
          if budget is not None and budget.returncode != 0:
              errors.append("the budget row exited %d" % budget.returncode)
          # the budget hook recorded the dispatch: the ceiling of the brief (USD 1.00) is in its pending record
          pending = glob.glob(os.path.join(lab, "__statera__", ".harness", "pending", "*-tu1.json"))
          print("pending records:", pending, flush=True)
          if len(pending) != 1 or json.load(open(pending[0], encoding="utf-8")).get("B") != 1.0:
              errors.append("the budget row left no pending record with B 1.0 for tu1")
          for e in errors:
              print("::error::" + e)
          sys.exit(1 if errors else 0)
          PY

  commit_back:
    needs: install_smoke
    timeout-minutes: 10
    # a push to main, or a dispatch on main that asked for it; never from another branch
    if: ${{ !cancelled() && needs.install_smoke.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_back)) }}
    runs-on: ubuntu-24.04
    # the only job that can write to the repository
    permissions:
      contents: write
    # one commit at a time, queued and never cancelled half-way through a push
    concurrency:
      group: bin-commit
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-and-manifest
          path: ${{ runner.temp }}/assembled
      - name: Commit bin/ on top of the current main
        env:
          ASSEMBLED: ${{ runner.temp }}/assembled
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          want=""
          for d in "$ASSEMBLED"/*/; do want="${want:+$want,}$(basename "$d")"; done
          echo "targets: $want"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            tip=$(git rev-parse origin/main)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
                echo "::notice::main no longer contains $GITHUB_SHA (rewritten); nothing committed, the run for the new main builds its own"
                exit 0
              fi
              echo "::notice::main moved from $GITHUB_SHA to $tip during the run"
            fi
            git checkout -q -f -B main "$tip"
            rm -rf "${PLUGIN:?}"/bin/*/
            mkdir -p "$PLUGIN/bin"
            for d in "$ASSEMBLED"/*/; do cp -R "${d%/}" "$PLUGIN/bin/"; done
            find "$PLUGIN/bin" -mindepth 2 -type f ! -name '*.exe' -exec chmod +x {} +
            python3 -I "$PLUGIN/scripts/build_manifest.py" --expect-targets "$want"
            # the binaries stand only while the sources they were built from are still the sources on main
            if ! python3 -I -c '
          import json, sys
          a, b = (json.load(open(f)) for f in sys.argv[1:3])
          keys = ("rust_sources_sha256", "scripts_sha256")
          sys.exit(0 if all(a.get(k) == b.get(k) for k in keys) else 1)
          ' "$ASSEMBLED/manifest.json" "$PLUGIN/bin/manifest.json"; then
              echo "::notice::the hashed sources changed between $GITHUB_SHA and $tip; nothing committed, the newer push runs its own build"
              exit 0
            fi
            git add "$PLUGIN/bin"
            if git diff --cached --quiet; then
              echo "::notice::bin/ on main already holds these binaries; nothing to commit"
              exit 0
            fi
            git commit -q -m "build(bin): hook binaries for ${GITHUB_SHA::7}"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push rejected (main moved again); attempt $attempt of 3"
            sleep 5
          done
          echo "::error::main kept moving; bin/ not committed"
          exit 1

  # Every commit in the range is a valid message of the vocabulary (.cz.toml), and no trace type touches the shipped plugin (D4). Runs on every event, whatever changed.
  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check commitizen==4.19.2
      # cz check needs an identity as soon as it creates anything under .git
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # a PR: its commits; a push: the commits it brought; a manual run, or a push whose predecessor is gone (new branch, rewritten history): everything since the last release
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            last=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | head -1)
            range="${last:+$last..}$GITHUB_SHA"
          fi
          echo "range=$range"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count "$range")" >> "$GITHUB_OUTPUT"
      - name: cz check over the range
        if: steps.range.outputs.count != '0'
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: cz check --rev-range "$RANGE"
      - name: No trace type touches plugins/murmuration/** (D4)
        if: steps.range.outputs.count != '0'
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 -I .github/scripts/check_trace_paths.py "$RANGE"

  # What would merging this PR cut? Informs the reviewer; changes nothing.
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check commitizen==4.19.2
      - name: The version a merge would cut
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # the checkout is the merge of the PR into main; GitHub will give the merge commit this title and body, and cz reads every line of both
          git -c user.name=preview -c user.email=preview@invalid commit --allow-empty -q -m "$PR_TITLE" -m "$PR_BODY"
          rc=0
          out=$(cz bump --dry-run --yes 2>&1) || rc=$?
          echo "$out"
          # cz's own codes: 21 no commit warrants a bump, 3 no commit since the tag
          case "$rc" in
            0) msg="a merge would release $(sed -n 's/^tag to create: //p' <<< "$out")" ;;
            3|21) msg="nothing to release" ;;
            *) echo "::error::cz bump --dry-run exited $rc"; exit "$rc" ;;
          esac
          echo "::notice title=release preview::$msg"
          echo "release preview: $msg" >> "$GITHUB_STEP_SUMMARY"

  # Cuts the release after a merge: bump commit, tag, GitHub Release. The only job besides commit_back that may write, and it runs on main alone.
  release:
    # build is named so that a red matrix (Windows included) stops the release; install_smoke and commit_back are named so that none of them was skipped, unless `changes` found nothing to build
    needs: [changes, commits, build, install_smoke, commit_back]
    # `!cancelled()` so that this job runs when a gate was skipped, and every requirement re-stated because a status function also runs the job after a failure. A manual run releases only when it also commits bin/.
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.changes.result == 'success'
      && needs.commits.result == 'success'
      && ((needs.changes.outputs.gated == 'true'
          && needs.build.result == 'success'
          && needs.install_smoke.result == 'success'
          && needs.commit_back.result == 'success')
        || (needs.changes.outputs.gated != 'true'
          && needs.build.result == 'skipped'
          && needs.install_smoke.result == 'skipped'
          && needs.commit_back.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check commitizen==4.19.2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 1. No v* tag means no baseline; fail closed
        run: |
          set -euo pipefail
          git fetch --tags origin
          last=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "$last" ]; then
            echo "::error::no v* tag in this repository: cz would count every commit as unreleased. Seed the baseline tag by hand (writing-release recovery.md, first release); nothing was released."
            exit 1
          fi
          echo "last release: $last"
      - name: 2. Check out the current tip of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # the commit_back job may have pushed bin/ after this run started, and so may anyone else
          git checkout -q -f -B main origin/main
          last=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | head -1)
          if ! git merge-base --is-ancestor "$last" HEAD; then
            echo "::error::the last tag $last is not an ancestor of origin/main ($(git rev-parse --short HEAD)); cz would bump from the wrong baseline. Nothing was released."
            exit 1
          fi
          git log --oneline "$last..HEAD" | head -20
      - name: 3. The binaries in bin/ were built from this tip's sources
        run: |
          if ! python3 -I .github/scripts/manifest_matches.py; then
            echo "::error::bin/manifest.json is not from the sources at origin/main $(git rev-parse --short HEAD). A push landed during the run, or a build was lost; the run for that push releases, or dispatch this workflow on main with commit_back. Nothing was released."
            exit 1
          fi
      - name: 4. Bump
        id: bump
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          # exit codes of cz 4.19.2: 21 NO_INCREMENT (no commit warrants a bump), 3 NO_COMMITS_FOUND (HEAD is the last tag)
          cz --no-raise 3,21 bump --yes
          # 5. HEAD has not moved: nothing to release
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "::notice title=release::nothing to release since $(git describe --tags --abbrev=0)"
            exit 0
          fi
          tag=$(git describe --tags --exact-match HEAD)
          files=$(git diff --name-only HEAD~1 HEAD)
          if [ "$files" != "plugins/murmuration/.claude-plugin/plugin.json" ]; then
            echo "::error::the bump commit changed more than the plugin manifest: $files"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git log -1 --format='bump commit %h: %s'
      # one atomic push: the branch and the tag land together, or neither does (main moved since step 2)
      - name: 6. Push the bump commit and the tag
        if: steps.bump.outputs.tag != ''
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"
      # runs after a bump and also when there is nothing to bump, so that a tag whose Release failed to be created (step 7 after the push of step 6) is repaired by the next run or dispatch
      - name: 7. GitHub Release
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create=1
          if [ -z "$TAG" ]; then
            TAG=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | head -1)
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::notice title=release::$TAG already has its GitHub Release"
              create=0
            else
              echo "::warning title=release::$TAG has no GitHub Release (an earlier run failed after its push); creating it"
            fi
          fi
          if [ "$create" = 1 ]; then
            cz changelog --dry-run "${TAG#v}" > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then printf 'Release %s\n' "$TAG" > "$RUNNER_TEMP/notes.md"; fi
            cat "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
